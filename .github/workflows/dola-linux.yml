name: Dola Linux x86_64

on:
  pull_request:
    paths:
      - ".github/workflows/dola-linux.yml"
      - "dola/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dola-linux.yml"
      - "dola/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dola-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    name: Linux x86_64 core
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: dola

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Follow hermetic-llvm's cache pattern: every successful commit writes a
      # new immutable cache and subsequent commits restore the newest prefix.
      - name: Mount Bazel disk cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel-disk
          key: dola-bazel-disk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dola/.bazelversion', 'dola/MODULE.bazel', 'dola/MODULE.bazel.lock', 'dola/**/BUILD.bazel', 'dola/**/*.bzl', 'dola/bazel/patches/**') }}-${{ github.sha }}-core
          restore-keys: |
            dola-bazel-disk-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Bazelisk
        shell: bash
        env:
          BAZELISK_VERSION: v1.29.0
        run: |
          ./ci/install_bazelisk.sh "${RUNNER_TEMP}/bazel"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Validate Dola
        shell: bash
        run: ./ci/run_linux_x86_64.sh core

  linux-x86_64-quality:
    name: Linux x86_64 quality
    needs: linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: dola

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore Bazel disk cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel-disk
          key: dola-bazel-disk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dola/.bazelversion', 'dola/MODULE.bazel', 'dola/MODULE.bazel.lock', 'dola/**/BUILD.bazel', 'dola/**/*.bzl', 'dola/bazel/patches/**') }}-${{ github.sha }}-quality
          restore-keys: |
            dola-bazel-disk-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Bazelisk
        shell: bash
        env:
          BAZELISK_VERSION: v1.29.0
        run: |
          ./ci/install_bazelisk.sh "${RUNNER_TEMP}/bazel"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Validate formatting and static analysis
        shell: bash
        run: ./ci/run_linux_x86_64.sh quality
